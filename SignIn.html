<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotfuck - Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 60px rgba(139, 92, 246, 0.3);
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    .vinyl-record {
      width: 150px;
      height: 150px;
      background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
      border-radius: 50%;
      margin: 0 auto 2rem;
      position: relative;
      animation: spin 3s linear infinite;
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.3);
    }

    .vinyl-record::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      background: linear-gradient(145deg, #8b5cf6, #6366f1);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
    }

    .vinyl-record::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #0a0a0a;
      border-radius: 50%;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899, #8b5cf6);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient 3s ease infinite;
    }

    @keyframes gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 24px;
    }

    .enter-btn {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
    }

    .github-link {
      display: inline-block;
      margin-top: 16px;
      color: #8b5cf6;
      text-decoration: none;
      font-size: 14px;
    }

    .github-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="vinyl-record"></div>
    <h1>Spotfuck</h1>
    <p>Music streaming with multiple API integrations</p>
    <a href="owo.html" class="enter-btn">Enter App</a>
    <br>
    <a href="https://github.com/ReSpotF-ck/ReSpotFuck-Web" class="github-link">View on GitHub</a>
  </div>

  <script>
    // Auto-redirect after 2 seconds for smoother experience
    setTimeout(() => {
      window.location.href = 'owo.html';
    }, 2000);
  </script>
</body>
</html>
