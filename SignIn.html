<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotfuck - Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(239, 68, 68, 0.2);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 60px rgba(239, 68, 68, 0.3);
      max-width: 500px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .vinyl-record {
      width: 150px;
      height: 150px;
      background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
      border-radius: 50%;
      margin: 0 auto 2rem;
      position: relative;
      animation: spin 3s linear infinite, pulse 2s ease-in-out infinite;
      box-shadow: 0 0 60px rgba(239, 68, 68, 0.3);
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 60px rgba(239, 68, 68, 0.3);
      }
      50% {
        box-shadow: 0 0 80px rgba(239, 68, 68, 0.5);
      }
    }

    .vinyl-record::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      background: linear-gradient(145deg, #ef4444, #dc2626);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }

    .vinyl-record::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #0a0a0a;
      border-radius: 50%;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ef4444, #f87171, #ef4444);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient 3s ease infinite;
    }

    @keyframes gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 24px;
    }

    .enter-btn {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
    }

    .github-link {
      display: inline-block;
      margin-top: 16px;
      color: #ef4444;
      text-decoration: none;
      font-size: 14px;
    }

    .github-link:hover {
      text-decoration: underline;
    }

    .invite-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .invite-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .invite-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .invite-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .invite-btn.telegram {
      background: rgba(0, 136, 204, 0.2);
      border-color: rgba(0, 136, 204, 0.4);
      animation: fadeIn 0.5s ease-out 0.2s both;
    }

    .invite-btn.telegram:hover {
      background: rgba(0, 136, 204, 0.3);
    }

    .invite-btn.discord {
      background: rgba(88, 101, 242, 0.2);
      border-color: rgba(88, 101, 242, 0.4);
      animation: fadeIn 0.5s ease-out 0.3s both;
    }

    .invite-btn.discord:hover {
      background: rgba(88, 101, 242, 0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .invite-form {
      max-width: 400px;
      margin: 0 auto;
    }

    .invite-form input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
      transition: all 0.3s ease;
    }

    .invite-form input:focus {
      border-color: #8b5cf6;
      background: rgba(255, 255, 255, 0.15);
    }

    .invite-form input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .invite-form button {
      width: 100%;
      padding: 12px 24px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: fadeIn 0.5s ease-out 0.5s both;
    }

    .invite-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    .notification-banner {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(139, 92, 246, 0.15));
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: slideDown 0.6s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .notification-icon {
      color: #ef4444;
      font-size: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .notification-content {
      text-align: left;
      flex: 1;
    }

    .notification-title {
      font-weight: 600;
      font-size: 14px;
      color: #fff;
      margin-bottom: 4px;
    }

    .notification-text {
      font-size: 13px;
      color: #a0a0a0;
      line-height: 1.4;
    }

    .notification-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="vinyl-record"></div>
    
    <!-- Notification Banner -->
    <div class="notification-banner">
      <div class="notification-icon">
        <i class="fas fa-construction"></i>
      </div>
      <div class="notification-content">
        <div class="notification-badge">Coming Soon</div>
        <div class="notification-title">Private Community</div>
        <div class="notification-text">Our exclusive private community is launching soon! Some features on this page may not yet be available. Stay tuned for updates.</div>
      </div>
    </div>
    
    <h1>Spotfuck</h1>
    <p>Music streaming with multiple API integrations</p>
    
    <div class="invite-section">
      <p style="color: #a0a0a0; margin-bottom: 15px;">Join our community to request access:</p>
      <div class="invite-buttons">
        <a href="https://t.me/your_telegram" target="_blank" class="invite-btn telegram">
          <i class="fab fa-telegram"></i> Join Telegram
        </a>
        <a href="https://discord.gg/your_discord" target="_blank" class="invite-btn discord">
          <i class="fab fa-discord"></i> Join Discord
        </a>
      </div>
      
      <div class="invite-form">
        <input type="text" id="inviteName" placeholder="Your name">
        <input type="email" id="inviteEmail" placeholder="Your email">
        <input type="text" id="inviteReason" placeholder="Why do you want access?">
        <button onclick="submitInviteRequest()">Request Access</button>
      </div>
    </div>
  </div>

  <script>
    // Invite form submission
    function submitInviteRequest() {
      const name = document.getElementById('inviteName').value;
      const email = document.getElementById('inviteEmail').value;
      const reason = document.getElementById('inviteReason').value;
      
      if (!name || !email || !reason) {
        alert('Please fill in all fields');
        return;
      }
      
      // In a real implementation, you would send this to a server
      // For now, we'll just show a success message
      alert('Thank you for your request! We will review it and get back to you soon.');
      
      // Clear form
      document.getElementById('inviteName').value = '';
      document.getElementById('inviteEmail').value = '';
      document.getElementById('inviteReason').value = '';
    }
  </script>
</body>
</html>
