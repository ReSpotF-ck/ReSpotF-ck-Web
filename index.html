<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotfuck - Private Access</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .music-notes {
      position: fixed;
      font-size: 2rem;
      opacity: 0.3;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .music-notes:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .music-notes:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
    .music-notes:nth-child(3) { bottom: 30%; left: 15%; animation-delay: 2s; }
    .music-notes:nth-child(4) { bottom: 15%; right: 10%; animation-delay: 3s; }
    .music-notes:nth-child(5) { top: 40%; left: 5%; animation-delay: 4s; }
    .music-notes:nth-child(6) { top: 60%; right: 5%; animation-delay: 5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 40px;
    }

    .vinyl-record {
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      position: relative;
      animation: spin 8s linear infinite;
      box-shadow: 0 0 60px rgba(239, 68, 68, 0.3);
    }

    .grooves {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .grooves:nth-child(1) { width: 180px; height: 180px; }
    .grooves:nth-child(2) { width: 140px; height: 140px; }
    .grooves:nth-child(3) { width: 100px; height: 100px; }
    .grooves:nth-child(4) { width: 60px; height: 60px; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInDown 1s ease;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container > p {
      font-size: 18px;
      color: #a0a0a0;
      margin-bottom: 30px;
      line-height: 1.6;
      animation: fadeIn 1s ease 0.3s forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .equalizer {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 30px 0;
    }

    .equalizer-bar {
      width: 8px;
      height: 40px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-radius: 4px;
      animation: equalize 1s ease-in-out infinite;
    }

    .equalizer-bar:nth-child(1) { animation-delay: 0s; }
    .equalizer-bar:nth-child(2) { animation-delay: 0.1s; }
    .equalizer-bar:nth-child(3) { animation-delay: 0.2s; }
    .equalizer-bar:nth-child(4) { animation-delay: 0.3s; }
    .equalizer-bar:nth-child(5) { animation-delay: 0.4s; }
    .equalizer-bar:nth-child(6) { animation-delay: 0.5s; }
    .equalizer-bar:nth-child(7) { animation-delay: 0.6s; }
    .equalizer-bar:nth-child(8) { animation-delay: 0.7s; }

    @keyframes equalize {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.5); }
    }

    .private-message {
      font-size: 24px;
      font-weight: 700;
      color: #ef4444;
      margin-bottom: 8px;
      animation: fadeIn 1s ease 0.6s forwards;
      opacity: 0;
    }

    .private-submessage {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
      animation: fadeIn 1s ease 0.8s forwards;
      opacity: 0;
    }

    .signin-btn {
      padding: 16px 40px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
      animation: fadeInUp 1s ease 1s forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .signin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(239, 68, 68, 0.4);
    }

    .signin-btn:active {
      transform: translateY(0);
    }

    .header {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    @media (max-width: 768px) {
      h1 { font-size: 40px; }
      .vinyl-record { width: 150px; height: 150px; }
      .grooves:nth-child(1) { width: 130px; height: 130px; }
      .grooves:nth-child(2) { width: 100px; height: 100px; }
      .grooves:nth-child(3) { width: 70px; height: 70px; }
      .grooves:nth-child(4) { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="music-notes">🎵</div>
  <div class="music-notes">🎶</div>
  <div class="music-notes">🎵</div>
  <div class="music-notes">🎶</div>
  <div class="music-notes">🎵</div>
  <div class="music-notes">🎶</div>

  <div class="header">
    <a href="https://respotfck.netlify.app/signin" class="signin-btn">Sign In</a>
  </div>

  <div class="container">
    <div class="vinyl-record">
      <div class="grooves"></div>
      <div class="grooves"></div>
      <div class="grooves"></div>
      <div class="grooves"></div>
    </div>
    <h1>Spotfuck</h1>
    <p>
      Open-source music streaming with multiple API integrations
    </p>
    <div class="equalizer">
      <div class="equalizer-bar"></div>
      <div class="equalizer-bar"></div>
      <div class="equalizer-bar"></div>
      <div class="equalizer-bar"></div>
      <div class="equalizer-bar"></div>
      <div class="equalizer-bar"></div>
      <div class="equalizer-bar"></div>
      <div class="equalizer-bar"></div>
    </div>
    <p class="private-message">Private Community</p>
    <p class="private-submessage">This is a private community. Access is restricted to authorized members only.</p>
    <div style="margin-top: 30px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
      <a href="SignIn.html" class="signin-btn" style="padding: 16px 40px; font-size: 18px;">Sign In</a>
    </div>
  </div>

  <script>
    // Security measures
    let devToolsOpen = false;

    const detectDevTools = () => {
      const threshold = 160;
      const widthDiff = window.outerWidth - window.innerWidth > threshold;
      const heightDiff = window.outerHeight - window.innerHeight > threshold;

      if (widthDiff || heightDiff) {
        if (!devToolsOpen) {
          devToolsOpen = true;
          alert('Developer tools detected! This action has been logged.');
        }
      } else {
        devToolsOpen = false;
      }
    };

    setInterval(detectDevTools, 1000);

    // Disable text selection (keeps buttons clickable)
    document.addEventListener('selectstart', function(e) {
      e.preventDefault();
      return false;
    });

    // Disable drag and drop
    document.addEventListener('dragstart', function(e) {
      e.preventDefault();
      return false;
    });

    // Clear console on load
    console.clear();
    console.log('%cSecurity Alert', 'color: red; font-size: 30px; font-weight: bold;');
    console.log('%cThis is a private secure connection. Unauthorized access is prohibited.', 'color: orange; font-size: 16px;');

    // Disable inspect element via long press (mobile)
    let touchTimer;
    document.addEventListener('touchstart', function(e) {
      touchTimer = setTimeout(function() {
        alert('Inspect element is disabled on this secure page.');
      }, 800);
    });

    document.addEventListener('touchend', function() {
      clearTimeout(touchTimer);
    });

    // Warn on page visibility change (potential tab switching to dev tools)
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        console.log('Page hidden - potential security concern');
      }
    });
  </script>
</body>
</html>
