<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Functionality Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-item {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #dc2626;
        }
        .success { border-left-color: #059669; }
        .error { border-left-color: #dc2626; }
        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #ff3333; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Spotfuck Quick Functionality Test</h1>
    <p>This page tests the basic functionality of the Spotfuck music player.</p>

    <div class="test-item">
        <h3>1. API Handler Loading</h3>
        <button onclick="testAPIHandler()">Test API Handler</button>
        <div id="apiHandlerResult">Not tested</div>
    </div>

    <div class="test-item">
        <h3>2. Audius API Test</h3>
        <button onclick="testAudius()">Test Audius Search</button>
        <div id="audiusResult">Not tested</div>
    </div>

    <div class="test-item">
        <h3>3. Configuration Loading</h3>
        <button onclick="testConfig()">Test Config Loading</button>
        <div id="configResult">Not tested</div>
    </div>

    <div class="test-item">
        <h3>4. LocalStorage Test</h3>
        <button onclick="testLocalStorage()">Test LocalStorage</button>
        <div id="storageResult">Not tested</div>
    </div>

    <div id="results"></div>

    <script src="api-handler.js"></script>
    <script>
        async function testAPIHandler() {
            const resultDiv = document.getElementById('apiHandlerResult');
            try {
                await window.initAPIHandler();
                resultDiv.innerHTML = '<span class="success">✓ API Handler loaded successfully</span>';
                resultDiv.className = 'success';
                console.log('API Handler functions:', {
                    searchAudius: typeof window.searchAudius,
                    searchJamendo: typeof window.searchJamendo,
                    searchYouTube: typeof window.searchYouTube,
                    searchSpotify: typeof window.searchSpotify
                });
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Failed: ${error.message}</span>`;
                resultDiv.className = 'error';
            }
        }

        async function testAudius() {
            const resultDiv = document.getElementById('audiusResult');
            try {
                const result = await window.searchAudius('test');
                if (result.success) {
                    resultDiv.innerHTML = `<span class="success">✓ Audius API working - Found ${result.tracks?.length || 0} tracks</span>`;
                    resultDiv.className = 'success';
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ Audius API error: ${result.error}</span>`;
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Failed: ${error.message}</span>`;
                resultDiv.className = 'error';
            }
        }

        async function testConfig() {
            const resultDiv = document.getElementById('configResult');
            try {
                const success = await window.fetchConfigFromRepo('https://github.com/ReSpotF-ck/ReSpotFuck-Web');
                if (success) {
                    resultDiv.innerHTML = '<span class="success">✓ Config loaded from GitHub</span>';
                    resultDiv.className = 'success';
                } else {
                    resultDiv.innerHTML = '<span class="error">✗ Failed to load config from GitHub</span>';
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Failed: ${error.message}</span>`;
                resultDiv.className = 'error';
            }
        }

        function testLocalStorage() {
            const resultDiv = document.getElementById('storageResult');
            try {
                localStorage.setItem('testKey', 'testValue');
                const value = localStorage.getItem('testKey');
                localStorage.removeItem('testKey');
                if (value === 'testValue') {
                    resultDiv.innerHTML = '<span class="success">✓ LocalStorage working correctly</span>';
                    resultDiv.className = 'success';
                } else {
                    resultDiv.innerHTML = '<span class="error">✗ LocalStorage read/write mismatch</span>';
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Failed: ${error.message}</span>`;
                resultDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
