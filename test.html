<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotfuck API Test Suite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            color: #ffffff;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #dc2626;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #b3b3b3;
            margin-bottom: 30px;
        }
        .test-section {
            background: #121212;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            color: #dc2626;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #dc2626;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover {
            background: #ff3333;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }
        button.secondary {
            background: #333;
        }
        button.secondary:hover {
            background: #444;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #b3b3b3;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            background: #282828;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #dc2626;
        }
        #results {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        .track {
            padding: 15px;
            margin: 10px 0;
            background: #282828;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .track img {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            object-fit: cover;
        }
        .track-info {
            flex: 1;
        }
        .track-info h4 {
            margin: 0 0 5px 0;
        }
        .track-info p {
            margin: 0;
            color: #b3b3b3;
            font-size: 14px;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .status.success {
            background: #059669;
            color: white;
        }
        .status.error {
            background: #dc2626;
            color: white;
        }
        .status.pending {
            background: #d97706;
            color: white;
        }
        .log-entry {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
        }
        .log-entry.success {
            background: rgba(5, 150, 105, 0.2);
            color: #4ade80;
            border-left: 3px solid #059669;
        }
        .log-entry.error {
            background: rgba(220, 38, 38, 0.2);
            color: #f87171;
            border-left: 3px solid #dc2626;
        }
        .log-entry.info {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border-left: 3px solid #3b82f6;
        }
        .config-display {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .test-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card h3 {
            margin: 0 0 10px 0;
            color: #b3b3b3;
            font-size: 12px;
        }
        .summary-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <h1><i class="fas fa-flask"></i> Spotfuck API Test Suite</h1>
    <p class="subtitle">Comprehensive testing for all music APIs and features</p>
    
    <div class="test-summary">
        <div class="summary-card">
            <h3>Total Tests</h3>
            <div class="number" id="totalTests">0</div>
        </div>
        <div class="summary-card">
            <h3>Passed</h3>
            <div class="number" id="passedTests" style="color: #059669;">0</div>
        </div>
        <div class="summary-card">
            <h3>Failed</h3>
            <div class="number" id="failedTests" style="color: #dc2626;">0</div>
        </div>
    </div>

    <div class="test-section">
        <h2><i class="fas fa-cog"></i> Configuration Test</h2>
        <div class="input-group">
            <label>GitHub Repository URL (for config.json)</label>
            <input type="text" id="repoUrl" value="https://github.com/ReSpotF-ck/ReSpotFuck-Web" placeholder="https://github.com/owner/repo">
        </div>
        <div class="button-group">
            <button onclick="testConfig()">Test Config Fetch</button>
            <button onclick="testLocalStorage()" class="secondary">Test LocalStorage</button>
        </div>
    </div>

    <div class="test-section">
        <h2><i class="fas fa-music"></i> Audius API Test (FREE)</h2>
        <div class="input-group">
            <label>Search Query</label>
            <input type="text" id="audiusQuery" value="lofi" placeholder="Enter search term">
        </div>
        <div class="button-group">
            <button onclick="testAudius()">Test Audius Search</button>
            <button onclick="testAudiusArtwork()" class="secondary">Test Artwork Fetch</button>
            <button onclick="testAudiusStream()" class="secondary">Test Stream URL</button>
        </div>
    </div>

    <div class="test-section">
        <h2><i class="fab fa-youtube"></i> YouTube API Test</h2>
        <div class="input-group">
            <label>YouTube API Key</label>
            <input type="text" id="youtubeApiKey" placeholder="Enter your YouTube API key">
        </div>
        <div class="input-group">
            <label>Search Query</label>
            <input type="text" id="youtubeQuery" value="music" placeholder="Enter search term">
        </div>
        <div class="button-group">
            <button onclick="testYouTube()">Test YouTube Search</button>
            <button onclick="testYouTubeThumbnails()" class="secondary">Test Thumbnails</button>
        </div>
    </div>

    <div class="test-section">
        <h2><i class="fab fa-spotify"></i> Spotify API Test</h2>
        <div class="input-group">
            <label>Spotify Client ID</label>
            <input type="text" id="spotifyClientId" placeholder="Enter your Spotify Client ID">
        </div>
        <div class="input-group">
            <label>Spotify Client Secret</label>
            <input type="password" id="spotifyClientSecret" placeholder="Enter your Spotify Client Secret">
        </div>
        <div class="input-group">
            <label>Search Query</label>
            <input type="text" id="spotifyQuery" value="test" placeholder="Enter search term">
        </div>
        <div class="button-group">
            <button onclick="testSpotify()">Test Spotify Search</button>
            <button onclick="testSpotifyToken()" class="secondary">Test Access Token</button>
            <button onclick="testSpotifyAlbumArt()" class="secondary">Test Album Art</button>
        </div>
    </div>

    <div class="test-section">
        <h2><i class="fas fa-headphones"></i> Jamendo API Test</h2>
        <div class="input-group">
            <label>Jamendo Client ID</label>
            <input type="text" id="jamendoClientId" value="c4ce16c7" placeholder="Enter Jamendo Client ID">
        </div>
        <div class="input-group">
            <label>Search Query</label>
            <input type="text" id="jamendoQuery" value="rock" placeholder="Enter search term">
        </div>
        <div class="button-group">
            <button onclick="testJamendo()">Test Jamendo Search</button>
            <button onclick="testJamendoArtwork()" class="secondary">Test Artwork Fetch</button>
        </div>
    </div>

    <div class="test-section">
        <h2><i class="fas fa-play-circle"></i> Run All Tests</h2>
        <div class="button-group">
            <button onclick="runAllTests()">Run All API Tests</button>
            <button onclick="clearResults()" class="secondary">Clear Results</button>
        </div>
    </div>

    <div id="results">
        <p style="color: #b3b3b3; text-align: center;">Click a test button above to begin...</p>
    </div>

    <script>
        let testStats = { total: 0, passed: 0, failed: 0 };
        
        function updateStats(passed) {
            testStats.total++;
            if (passed) testStats.passed++;
            else testStats.failed++;
            
            document.getElementById('totalTests').textContent = testStats.total;
            document.getElementById('passedTests').textContent = testStats.passed;
            document.getElementById('failedTests').textContent = testStats.failed;
        }
        
        function addLog(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = message;
            resultsDiv.appendChild(logEntry);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '<p style="color: #b3b3b3; text-align: center;">Click a test button above to begin...</p>';
            testStats = { total: 0, passed: 0, failed: 0 };
            document.getElementById('totalTests').textContent = '0';
            document.getElementById('passedTests').textContent = '0';
            document.getElementById('failedTests').textContent = '0';
        }
        
        // Configuration Tests
        async function testConfig() {
            addLog('Testing config fetch...', 'info');
            const repoUrl = document.getElementById('repoUrl').value;
            
            try {
                const match = repoUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
                if (!match) {
                    throw new Error('Invalid GitHub URL format');
                }
                
                const [, owner, repo] = match;
                const configUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/config.json`;
                
                addLog(`Fetching from: ${configUrl}`, 'info');
                const response = await fetch(configUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const config = await response.json();
                addLog('✓ Config fetched successfully', 'success');
                
                const configDisplay = document.createElement('div');
                configDisplay.className = 'config-display';
                configDisplay.textContent = JSON.stringify(config, null, 2);
                document.getElementById('results').appendChild(configDisplay);
                
                updateStats(true);
            } catch (error) {
                addLog(`✗ Config fetch failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        function testLocalStorage() {
            addLog('Testing localStorage...', 'info');
            try {
                localStorage.setItem('testKey', 'testValue');
                const value = localStorage.getItem('testKey');
                localStorage.removeItem('testKey');
                
                if (value === 'testValue') {
                    addLog('✓ localStorage working correctly', 'success');
                    updateStats(true);
                } else {
                    throw new Error('localStorage read/write mismatch');
                }
            } catch (error) {
                addLog(`✗ localStorage test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        // Audius Tests
        async function testAudius() {
            addLog('Testing Audius API...', 'info');
            const query = document.getElementById('audiusQuery').value;
            
            try {
                addLog('Step 1: Getting Audius host...', 'info');
                const hostResponse = await fetch('https://api.audius.co');
                const hostData = await hostResponse.json();
                
                if (!hostData.data || hostData.data.length === 0) {
                    throw new Error('No Audius hosts available');
                }
                
                const host = hostData.data[0];
                addLog(`✓ Got host: ${host}`, 'success');
                
                addLog(`Step 2: Searching for "${query}"...`, 'info');
                const searchResponse = await fetch(`https://${host}/v1/tracks/search?query=${encodeURIComponent(query)}&limit=5`);
                const searchData = await searchResponse.json();
                
                if (!searchData.data || searchData.data.length === 0) {
                    throw new Error('No tracks found');
                }
                
                addLog(`✓ Found ${searchData.data.length} tracks`, 'success');
                
                searchData.data.forEach(track => {
                    const artwork = track.artwork?.['480x480'] || track.artwork?.['150x150'] || '';
                    const trackDiv = document.createElement('div');
                    trackDiv.className = 'track';
                    trackDiv.innerHTML = `
                        <img src="${artwork}" onerror="this.src='https://via.placeholder.com/60'" alt="">
                        <div class="track-info">
                            <h4>${track.title}</h4>
                            <p>Artist: ${track.user.name} | Duration: ${track.duration}s</p>
                        </div>
                    `;
                    document.getElementById('results').appendChild(trackDiv);
                });
                
                addLog('✓ Audius test completed successfully', 'success');
                updateStats(true);
            } catch (error) {
                addLog(`✗ Audius test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        async function testAudiusArtwork() {
            addLog('Testing Audius artwork fetching...', 'info');
            try {
                const hostResponse = await fetch('https://api.audius.co');
                const hostData = await hostResponse.json();
                const host = hostData.data[0];
                
                const searchResponse = await fetch(`https://${host}/v1/tracks/search?query=art&limit=1`);
                const searchData = await searchResponse.json();
                
                if (searchData.data && searchData.data[0]) {
                    const track = searchData.data[0];
                    const artwork = track.artwork?.['1500x1500'] || track.artwork?.['480x480'] || track.artwork?.['150x150'] || '';
                    
                    if (artwork) {
                        addLog(`✓ Artwork URL found: ${artwork.substring(0, 50)}...`, 'success');
                        updateStats(true);
                    } else {
                        throw new Error('No artwork in response');
                    }
                } else {
                    throw new Error('No tracks found for artwork test');
                }
            } catch (error) {
                addLog(`✗ Artwork test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        async function testAudiusStream() {
            addLog('Testing Audius stream URL generation...', 'info');
            try {
                const hostResponse = await fetch('https://api.audius.co');
                const hostData = await hostResponse.json();
                const host = hostData.data[0];
                
                const searchResponse = await fetch(`https://${host}/v1/tracks/search?query=test&limit=1`);
                const searchData = await searchResponse.json();
                
                if (searchData.data && searchData.data[0]) {
                    const track = searchData.data[0];
                    const streamUrl = `https://${host}/v1/tracks/${track.id}/stream`;
                    addLog(`✓ Stream URL generated: ${streamUrl}`, 'success');
                    updateStats(true);
                } else {
                    throw new Error('No tracks found for stream test');
                }
            } catch (error) {
                addLog(`✗ Stream test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        // YouTube Tests
        async function testYouTube() {
            addLog('Testing YouTube API...', 'info');
            const apiKey = document.getElementById('youtubeApiKey').value;
            const query = document.getElementById('youtubeQuery').value;
            
            if (!apiKey) {
                addLog('✗ YouTube API key required', 'error');
                updateStats(false);
                return;
            }
            
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${encodeURIComponent(query + ' music')}&type=video&key=${apiKey}`;
                addLog(`Fetching: ${url.substring(0, 80)}...`, 'info');
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }
                
                if (!data.items || data.items.length === 0) {
                    throw new Error('No results found');
                }
                
                addLog(`✓ Found ${data.items.length} videos`, 'success');
                
                data.items.forEach(item => {
                    const thumbnail = item.snippet.thumbnails.high?.url || item.snippet.thumbnails.medium?.url || '';
                    const trackDiv = document.createElement('div');
                    trackDiv.className = 'track';
                    trackDiv.innerHTML = `
                        <img src="${thumbnail}" onerror="this.src='https://via.placeholder.com/60'" alt="">
                        <div class="track-info">
                            <h4>${item.snippet.title}</h4>
                            <p>Channel: ${item.snippet.channelTitle}</p>
                        </div>
                    `;
                    document.getElementById('results').appendChild(trackDiv);
                });
                
                addLog('✓ YouTube test completed successfully', 'success');
                updateStats(true);
            } catch (error) {
                addLog(`✗ YouTube test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        async function testYouTubeThumbnails() {
            addLog('Testing YouTube thumbnail fetching...', 'info');
            const apiKey = document.getElementById('youtubeApiKey').value;
            
            if (!apiKey) {
                addLog('✗ YouTube API key required', 'error');
                updateStats(false);
                return;
            }
            
            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=1&q=music&type=video&key=${apiKey}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.items && data.items[0]) {
                    const thumbnails = data.items[0].snippet.thumbnails;
                    addLog(`✓ Available thumbnails: ${Object.keys(thumbnails).join(', ')}`, 'success');
                    updateStats(true);
                } else {
                    throw new Error('No results for thumbnail test');
                }
            } catch (error) {
                addLog(`✗ Thumbnail test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        // Spotify Tests
        async function testSpotifyToken() {
            addLog('Testing Spotify access token...', 'info');
            const clientId = document.getElementById('spotifyClientId').value;
            const clientSecret = document.getElementById('spotifyClientSecret').value;
            
            if (!clientId || !clientSecret) {
                addLog('✗ Spotify credentials required', 'error');
                updateStats(false);
                return;
            }
            
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
                    },
                    body: 'grant_type=client_credentials'
                });
                
                const data = await response.json();
                
                if (data.access_token) {
                    addLog('✓ Access token obtained successfully', 'success');
                    addLog(`Token type: ${data.token_type}, Expires in: ${data.expires_in}s`, 'info');
                    updateStats(true);
                } else {
                    throw new Error(data.error_description || 'Failed to get token');
                }
            } catch (error) {
                addLog(`✗ Token test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        async function testSpotify() {
            addLog('Testing Spotify search...', 'info');
            const clientId = document.getElementById('spotifyClientId').value;
            const clientSecret = document.getElementById('spotifyClientSecret').value;
            const query = document.getElementById('spotifyQuery').value;
            
            if (!clientId || !clientSecret) {
                addLog('✗ Spotify credentials required', 'error');
                updateStats(false);
                return;
            }
            
            try {
                // Get token first
                const tokenResponse = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
                    },
                    body: 'grant_type=client_credentials'
                });
                
                const tokenData = await tokenResponse.json();
                
                if (!tokenData.access_token) {
                    throw new Error('Failed to get access token');
                }
                
                // Search
                const searchResponse = await fetch(
                    `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=5`,
                    {
                        headers: {
                            'Authorization': `Bearer ${tokenData.access_token}`
                        }
                    }
                );
                
                const searchData = await searchResponse.json();
                
                if (!searchData.tracks || !searchData.tracks.items || searchData.tracks.items.length === 0) {
                    throw new Error('No tracks found');
                }
                
                addLog(`✓ Found ${searchData.tracks.items.length} tracks`, 'success');
                
                searchData.tracks.items.forEach(track => {
                    const artwork = track.album.images[0]?.url || '';
                    const trackDiv = document.createElement('div');
                    trackDiv.className = 'track';
                    trackDiv.innerHTML = `
                        <img src="${artwork}" onerror="this.src='https://via.placeholder.com/60'" alt="">
                        <div class="track-info">
                            <h4>${track.name}</h4>
                            <p>Artist: ${track.artists[0]?.name} | Album: ${track.album.name}</p>
                        </div>
                    `;
                    document.getElementById('results').appendChild(trackDiv);
                });
                
                addLog('✓ Spotify test completed successfully', 'success');
                updateStats(true);
            } catch (error) {
                addLog(`✗ Spotify test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        async function testSpotifyAlbumArt() {
            addLog('Testing Spotify album art fetching...', 'info');
            const clientId = document.getElementById('spotifyClientId').value;
            const clientSecret = document.getElementById('spotifyClientSecret').value;
            
            if (!clientId || !clientSecret) {
                addLog('✗ Spotify credentials required', 'error');
                updateStats(false);
                return;
            }
            
            try {
                const tokenResponse = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
                    },
                    body: 'grant_type=client_credentials'
                });
                
                const tokenData = await tokenResponse.json();
                
                const searchResponse = await fetch(
                    `https://api.spotify.com/v1/search?q=test&type=track&limit=1`,
                    {
                        headers: {
                            'Authorization': `Bearer ${tokenData.access_token}`
                        }
                    }
                );
                
                const searchData = await searchResponse.json();
                
                if (searchData.tracks && searchData.tracks.items && searchData.tracks.items[0]) {
                    const images = searchData.tracks.items[0].album.images;
                    addLog(`✓ Found ${images.length} image sizes: ${images.map(img => img.height).join('px, ')}px`, 'success');
                    updateStats(true);
                } else {
                    throw new Error('No tracks found for album art test');
                }
            } catch (error) {
                addLog(`✗ Album art test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        // Jamendo Tests
        async function testJamendo() {
            addLog('Testing Jamendo API...', 'info');
            const clientId = document.getElementById('jamendoClientId').value;
            const query = document.getElementById('jamendoQuery').value;
            
            if (!clientId) {
                addLog('✗ Jamendo client ID required', 'error');
                updateStats(false);
                return;
            }
            
            try {
                const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${clientId}&format=jsonpretty&limit=5&include=musicinfo&imagesize=500&search=${encodeURIComponent(query)}`;
                addLog(`Fetching from Jamendo...`, 'info');
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }
                
                if (!data.results || data.results.length === 0) {
                    throw new Error('No tracks found');
                }
                
                addLog(`✓ Found ${data.results.length} tracks`, 'success');
                
                data.results.forEach(track => {
                    const artwork = track.image || track.album_image || '';
                    const trackDiv = document.createElement('div');
                    trackDiv.className = 'track';
                    trackDiv.innerHTML = `
                        <img src="${artwork}" onerror="this.src='https://via.placeholder.com/60'" alt="">
                        <div class="track-info">
                            <h4>${track.name}</h4>
                            <p>Artist: ${track.artist_name} | Duration: ${track.duration}s</p>
                        </div>
                    `;
                    document.getElementById('results').appendChild(trackDiv);
                });
                
                addLog('✓ Jamendo test completed successfully', 'success');
                updateStats(true);
            } catch (error) {
                addLog(`✗ Jamendo test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        async function testJamendoArtwork() {
            addLog('Testing Jamendo artwork fetching...', 'info');
            const clientId = document.getElementById('jamendoClientId').value;
            
            if (!clientId) {
                addLog('✗ Jamendo client ID required', 'error');
                updateStats(false);
                return;
            }
            
            try {
                const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${clientId}&format=jsonpretty&limit=1&include=musicinfo&imagesize=500&search=test`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results[0]) {
                    const track = data.results[0];
                    const artwork = track.image || track.album_image || '';
                    if (artwork) {
                        addLog(`✓ Artwork found: ${artwork.substring(0, 50)}...`, 'success');
                        updateStats(true);
                    } else {
                        throw new Error('No artwork in response');
                    }
                } else {
                    throw new Error('No tracks found for artwork test');
                }
            } catch (error) {
                addLog(`✗ Artwork test failed: ${error.message}`, 'error');
                updateStats(false);
            }
        }
        
        // Run All Tests
        async function runAllTests() {
            clearResults();
            addLog('Starting comprehensive test suite...', 'info');
            
            // Test Audius (always works)
            await testAudius();
            await new Promise(r => setTimeout(r, 500));
            
            // Test Jamendo (has default ID)
            await testJamendo();
            await new Promise(r => setTimeout(r, 500));
            
            // Test Config
            await testConfig();
            await new Promise(r => setTimeout(r, 500));
            
            // Test LocalStorage
            testLocalStorage();
            await new Promise(r => setTimeout(r, 500));
            
            // Test YouTube (if key provided)
            const youtubeKey = document.getElementById('youtubeApiKey').value;
            if (youtubeKey) {
                await testYouTube();
                await new Promise(r => setTimeout(r, 500));
            } else {
                addLog('Skipping YouTube test (no API key)', 'info');
            }
            
            // Test Spotify (if credentials provided)
            const spotifyId = document.getElementById('spotifyClientId').value;
            const spotifySecret = document.getElementById('spotifyClientSecret').value;
            if (spotifyId && spotifySecret) {
                await testSpotify();
            } else {
                addLog('Skipping Spotify test (no credentials)', 'info');
            }
            
            addLog('Test suite completed!', 'info');
            addLog(`Summary: ${testStats.passed}/${testStats.total} tests passed`, testStats.failed > 0 ? 'error' : 'success');
        }
    </script>
</body>
